# Change the default Omarchy look'n'feel
# https://wiki.hyprland.org/Configuring/Variables/#general

general {
    gaps_in = 4
    gaps_out = 8

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors


    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

}

# https://wiki.hyprland.org/Configuring/Variables/#decoration

decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    # active_opacity = 2.0
    # inactive_opacity = 0.9

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        vibrancy = 0.8
        contrast = 0.6
        size = 4
        passes = 3
        ignore_opacity = true

        noise = 0.1
        contrast = 1.5

        xray = false
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(13,13,17,0.5)
    }

}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# Animations are from https://github.com/NischalDawadi/Hyprlust

animations {
    enabled = true

    # Bezier curves
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = softSnap, 0.4, 0, 0.2, 1
    bezier = fluent, 0.0, 0.0, 0.2, 1.0
    bezier = easeInOutExpo, 0.87, 0, 0.13, 1

    # Windows
    animation = windows, 1, 3, overshot, popin 80%
    animation = windowsIn, 1, 3, overshot, popin 80%
    animation = windowsOut, 1, 3, smoothOut, popin 90%
    animation = windowsMove, 1, 3, softSnap

    # Layers
    animation = layersIn, 1, 7, smoothIn, slide right
    animation = layersOut, 1, 8, softSnap, slide right

    # Fade
    animation = fade, 1, 3, smoothIn
    animation = fadeIn, 1, 3, smoothIn
    animation = fadeOut, 1, 3, smoothOut
    animation = fadeSwitch, 1, 3, smoothIn
    animation = fadeShadow, 1, 3, smoothIn
    animation = fadeDim, 1, 3, smoothIn
    animation = fadeDpms, 1, 3, smoothIn
    animation = fadeLayers, 1, 3, softSnap

    # Workspaces
    animation = workspaces, 1, 3, overshot, slidefade 20%
    animation = specialWorkspace, 1, 5, overshot, slidefadevert 30%
}